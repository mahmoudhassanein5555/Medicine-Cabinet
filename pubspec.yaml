name: medicine_cabinet
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  shared_preferences: ^2.3.5
  toastification: ^2.3.0
  internet_connection_checker_plus: ^2.5.3
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  flutter_secure_storage: ^9.2.4
  universal_html: ^2.2.4
  lottie: ^3.3.1
  firebase_auth: ^5.7.0
  google_sign_in: ^7.2.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  http: ^1.6.0
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  injectable_generator: ^2.6.2
  flutter_lints: ^5.0.0
  intl_utils: ^2.8.10

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/animations/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf

flutter_intl:
  enabled: true
