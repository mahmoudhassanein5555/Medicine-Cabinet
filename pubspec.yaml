name: medicine_cabinet
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  shared_preferences: ^2.3.5
  toastification: ^2.3.0
  internet_connection_checker_plus: ^2.5.3
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  flutter_secure_storage: ^9.2.4
  universal_html: ^2.2.4
  lottie: ^3.3.1
  firebase_auth: ^5.7.0
  google_sign_in: ^7.2.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  http: ^1.6.0
  flutter_native_splash: ^2.4.8
  flutter_svg: ^2.0.10
  animate_do: ^5.1.0
  intl_utils: ^2.8.14

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_native_splash:
  color: "#FAFCFB"
  image: assets/images/splash_logo_light.png
  color_dark: "#0D1513"
  image_dark: assets/images/splash_logo_dark.png
  android_12:
    image: assets/images/splash_logo_light.png
    icon_background_color: "#FAFCFB"
    image_dark: assets/images/splash_logo_dark.png
    icon_background_color_dark: "#0D1513"



flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf

flutter_intl:
  enabled: true
