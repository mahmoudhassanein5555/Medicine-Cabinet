name: medicine_cabinet
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  http: ^1.6.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.7.1+4

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  # State Management
  flutter_bloc: ^9.1.1

  # Firebase
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  google_sign_in: ^7.2.0

  # Utilities
  toastification: ^2.3.0
  internet_connection_checker_plus: ^2.5.3
  universal_html: ^2.2.4
  dartz: ^0.10.1
  flutter_dotenv: ^6.0.1
  equatable: ^2.1.0

  # Medicine Scan
  camera: ^0.12.0+2
  image_picker: ^1.2.3

  # UI
  lottie: ^3.5.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10
  animate_do: ^5.1.0
  curved_labeled_navigation_bar: ^2.0.6
  curved_navigation_bar: ^1.0.6
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  easy_refresh: ^3.5.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.15
  injectable_generator: ^2.6.2

  # Localization
  intl_utils: ^2.8.14

  # App Icons
  flutter_launcher_icons: ^0.14.1

  # Splash Screen
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: "#FAFCFB"
  image: assets/images/splash_logo_light.png

  color_dark: "#0D1513"
  image_dark: assets/images/splash_logo_dark.png

  android_12:
    image: assets/images/splash_logo_light.png
    icon_background_color: "#FAFCFB"
    image_dark: assets/images/splash_logo_dark.png
    icon_background_color_dark: "#0D1513"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
    - assets/animation/
#    - .env

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf

flutter_intl:
  enabled: true